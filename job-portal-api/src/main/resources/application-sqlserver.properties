# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=sqlserver
# First create the database in SSMS:  CREATE DATABASE jobportal;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jobportal;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
