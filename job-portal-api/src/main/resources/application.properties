spring.application.name=job-portal-api
server.port=9696

# ---- Default DB: H2 in-memory (zero setup, data resets on restart) ----
spring.datasource.url=jdbc:h2:mem:jobportal;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# For real deployment set env var JWT_SECRET (min 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-it-must-be-at-least-32-chars-long}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
